# Publish @caresolutions/ai-infrastructure to Azure Artifacts npm feed
#
# Triggers on:
#   - Push to main — auto-bumps patch version and publishes
#   - Version tags (v1.0.0, v1.1.0, etc.) — publishes as-is
#
# Uses the Npm@1 task for built-in Azure Artifacts authentication

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - 'v*'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    displayName: 'Install Node.js'
    inputs:
      versionSpec: '20.x'

  - script: |
      CURRENT_VERSION=$(node -p "require('./package.json').version")
      echo "Current version: $CURRENT_VERSION"

      # Check if this version already exists in the feed
      npm view @caresolutions/ai-infrastructure@$CURRENT_VERSION version --registry https://pkgs.dev.azure.com/caresolutionsinc/_packaging/caresolutionsinc/npm/registry/ 2>/dev/null
      if [ $? -eq 0 ]; then
        echo "Version $CURRENT_VERSION already exists, bumping patch version..."
        NEW_VERSION=$(node -p "const v='$CURRENT_VERSION'.split('.'); v[2]=parseInt(v[2])+1; v.join('.')")
        echo "New version: $NEW_VERSION"
        npm version $NEW_VERSION --no-git-tag-version
      else
        echo "Version $CURRENT_VERSION does not exist yet, publishing as-is"
      fi
    displayName: 'Bump version if needed'
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))

  - task: Npm@1
    displayName: 'Publish to Azure Artifacts'
    inputs:
      command: 'publish'
      publishRegistry: 'useFeed'
      publishFeed: 'caresolutionsinc'

  - script: |
      echo "Published @caresolutions/ai-infrastructure@$(node -p "require('./package.json').version")"
    displayName: 'Confirm version'
